<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Habits</title>

<!-- PWA / iOS home-screen setup -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Habits" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-32.png" />

<link rel="stylesheet" href="style.css" />

<!-- Apply the saved theme before first paint, so there's no flash of the wrong theme -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("habitTheme") || "midnight";
      document.documentElement.setAttribute("data-app-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- ───────────────────────── AUTH SCREEN ───────────────────────── -->
<section id="auth-screen" class="screen">
  <div class="auth-card">
    <div class="brand">
      <img src="icons/icon-120.png" alt="" class="brand-icon" />
      <h1>Habits</h1>
      <p class="muted">Track any habit. Free, private, synced across your devices.</p>
    </div>

    <form id="auth-form" novalidate>
      <label class="field" id="auth-name-field" hidden>
        <span>Your name <span class="muted">(optional)</span></span>
        <input type="text" id="auth-name" autocomplete="name" maxlength="40" placeholder="What should we call you?" />
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" id="auth-email" autocomplete="email" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="auth-password" autocomplete="current-password" required minlength="6" />
      </label>
      <p id="auth-error" class="error-text" hidden></p>
      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <button id="auth-toggle-mode" class="btn-link">Don't have an account? Sign up</button>
  </div>
</section>

<!-- ───────────────────────── MAIN APP ───────────────────────── -->
<div id="app-root" hidden>

  <!-- Today view -->
  <main id="view-today" class="view">
    <header class="app-header">
      <div>
        <h1 id="greeting">Hello</h1>
        <p id="today-subline" class="muted"></p>
      </div>
    </header>

    <div class="view-switcher" role="group" aria-label="Habit list layout">
      <button type="button" class="view-switch-btn" data-view="grid" aria-label="Grid view">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
      </button>
      <button type="button" class="view-switch-btn" data-view="list" aria-label="List view">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"></rect><rect x="3" y="14" width="18" height="6" rx="1.5"></rect></svg>
      </button>
      <button type="button" class="view-switch-btn" data-view="table" aria-label="Table view">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="4" x2="9" y2="20"></line></svg>
      </button>
    </div>

    <div id="today-list"></div>

    <div id="today-empty" class="empty-state" hidden>
      <p>No habits yet.</p>
      <p class="muted">Tap the + button to add your first habit.</p>
    </div>
  </main>

  <!-- Stats view -->
  <main id="view-stats" class="view" hidden>
    <header class="app-header">
      <div>
        <h1>Stats</h1>
        <p class="muted">Your progress, at a glance</p>
      </div>
    </header>
    <div id="stats-overview"></div>
    <div id="stats-habit-list" class="habit-list habit-list--compact"></div>
  </main>

  <!-- Habit detail -->
  <main id="view-detail" class="view" hidden>
    <header class="app-header app-header--detail">
      <button id="detail-back" class="icon-btn" aria-label="Back">←</button>
      <div class="detail-actions">
        <button id="detail-edit" class="icon-btn" aria-label="Edit">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l.8-3.8L15.6 5.4a1.8 1.8 0 0 1 2.5 0l1.5 1.5a1.8 1.8 0 0 1 0 2.5L8.8 20.2 4 21z"></path><path d="M13.5 6.5l4 4"></path></svg>
        </button>
        <button id="detail-delete" class="icon-btn icon-btn--danger" aria-label="Delete">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        </button>
      </div>
    </header>
    <div id="detail-content"></div>
  </main>

  <!-- Settings -->
  <main id="view-settings" class="view" hidden>
    <header class="app-header">
      <div>
        <h1>Settings</h1>
        <p class="muted">Make it yours</p>
      </div>
    </header>

    <div class="section-card">
      <h3>Appearance</h3>
      <div id="theme-grid" class="theme-grid"></div>
    </div>

    <div class="section-card">
      <h3>Account</h3>
      <label class="field">
        <span>Your name</span>
        <input type="text" id="settings-name" maxlength="40" placeholder="What should we call you?" />
      </label>
      <p id="settings-email" class="muted" style="margin-bottom:14px;"></p>
      <button id="logout-btn" class="btn btn-secondary btn-block">Log out</button>
    </div>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tabbar">
    <button class="tab-btn active" data-tab="today">
      <span class="tab-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 5"></polyline></svg></span><span>Today</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <span class="tab-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="12"></line><line x1="12" y1="20" x2="12" y2="6"></line><line x1="19" y1="20" x2="19" y2="15"></line></svg></span><span>Stats</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <span class="tab-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span><span>Settings</span>
    </button>
    <button id="fab" class="fab" aria-label="Add habit">+</button>
  </nav>
</div>

<!-- ───────────────────────── ADD/EDIT HABIT MODAL ───────────────────────── -->
<div id="habit-modal" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="habit-modal-title">New habit</h2>
      <button id="habit-modal-close" class="icon-btn" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>
    <form id="habit-form">
      <label class="field">
        <span>Name</span>
        <input type="text" id="habit-name" maxlength="40" placeholder="e.g. Drink water" required />
      </label>
      <label class="field">
        <span>Description <span class="muted">(optional)</span></span>
        <textarea id="habit-description" maxlength="140" placeholder="e.g. 2 litres a day" rows="2"></textarea>
      </label>

      <div class="field">
        <span>Color</span>
        <div id="color-picker" class="color-picker"></div>
      </div>

      <div class="field">
        <span>Weekly goal</span>
        <div class="stepper">
          <button type="button" id="goal-minus" class="icon-btn">−</button>
          <span id="goal-value">7</span>
          <span class="muted">/ week</span>
          <button type="button" id="goal-plus" class="icon-btn">+</button>
        </div>
      </div>

      <label class="switch-row">
        <span>Track a daily count <span class="muted">(e.g. 3 cups of tea)</span></span>
        <input type="checkbox" id="count-toggle" />
        <span class="switch"></span>
      </label>

      <div id="count-fields" hidden>
        <div class="field">
          <span>Daily target</span>
          <div class="stepper">
            <button type="button" id="target-minus" class="icon-btn">−</button>
            <span id="target-value">3</span>
            <button type="button" id="target-plus" class="icon-btn">+</button>
          </div>
        </div>
        <label class="field">
          <span>Unit <span class="muted">(optional)</span></span>
          <input type="text" id="habit-unit" maxlength="16" placeholder="e.g. cups, glasses, pages" />
        </label>
      </div>

      <p id="habit-form-error" class="error-text" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Save habit</button>
    </form>
  </div>
</div>

<!-- ───────────────────────── COUNT CONTROL SHEET ───────────────────────── -->
<div id="count-sheet" class="modal-backdrop" hidden>
  <div class="modal count-sheet">
    <div class="sheet-handle"></div>
    <div class="count-sheet-header">
      <button id="count-sheet-close" class="icon-btn" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
      <div class="count-sheet-title">
        <h2 id="count-sheet-name">Habit</h2>
        <p id="count-sheet-goal" class="muted">Daily goal</p>
      </div>
      <button id="count-sheet-stats" class="icon-btn" aria-label="View stats">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="12"></line><line x1="12" y1="20" x2="12" y2="6"></line><line x1="19" y1="20" x2="19" y2="15"></line></svg>
      </button>
    </div>

    <div class="count-ring-row">
      <button type="button" id="count-sheet-dec" class="count-ring-btn" aria-label="Decrease">−</button>
      <div class="count-ring-wrap">
        <svg viewBox="0 0 140 140" class="count-ring">
          <circle class="count-ring-track" cx="70" cy="70" r="60"></circle>
          <circle id="count-ring-fill" class="count-ring-fill" cx="70" cy="70" r="60"></circle>
        </svg>
        <div class="count-ring-value" id="count-sheet-value">0</div>
      </div>
      <button type="button" id="count-sheet-inc" class="count-ring-btn" aria-label="Increase">+</button>
    </div>

    <div class="count-sheet-actions">
      <button type="button" id="count-sheet-reset" class="icon-btn" aria-label="Reset today">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5 4 1.5 10 7.5 10"></polyline><path d="M3.7 15a9 9 0 1 0 2.1-9.4L1.5 10"></path></svg>
      </button>
      <button type="button" id="count-sheet-complete" class="btn-complete">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 5"></polyline></svg>
        Complete all
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
